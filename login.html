<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Sonido Vivo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center vh-100">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-5 col-lg-4">
        <div class="card shadow-sm border-0 rounded-4">
          <div class="card-body p-4 text-center">
            <h3 class="fw-bold mb-4">Acceso Admin</h3>
            <form action="admin.html">
              <div class="mb-3 text-start">
                <label class="form-label fw-semibold">Usuario</label>
                <input type="text" class="form-control" required value="admin">
              </div>
              <div class="mb-4 text-start">
                <label class="form-label fw-semibold">Contraseña</label>
                <input type="password" class="form-control" required value="123456">
              </div>
              <button type="submit" class="btn btn-dark w-100 py-2 fw-semibold">Ingresar al Panel</button>
            </form>
            <a href="index.html" class="d-block mt-3 text-secondary text-decoration-none small">Volver a la tienda</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
