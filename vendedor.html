<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Vendedor - Sonido Vivo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-light" data-page="seller">

  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand fw-bold text-warning" href="index.html">
        <i class="fa-solid fa-guitar me-2"></i>Sonido Vivo - Vendedor
      </a>
      <div class="d-flex align-items-center gap-2">
        <a href="index.html" class="btn btn-outline-light btn-sm"><i class="fa-solid fa-store me-1"></i> Tienda</a>
        <button class="btn btn-outline-light btn-sm" onclick="cerrarSesion()">
          <i class="fa-solid fa-right-from-bracket me-1"></i> Cerrar sesión
        </button>
      </div>
    </div>
  </nav>

  <div class="container my-4" id="vendorDashboard">
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
      <div>
        <h2 class="fw-bold mb-1"><i class="fa-solid fa-warehouse me-2 text-warning"></i>Gestión de inventario y pedidos</h2>
        <small class="text-muted">Operaciones comerciales y seguimiento de stock</small>
      </div>
    </div>

    <div class="row g-4 mb-4">
      <div class="col-md-4">
        <div class="card shadow-sm border-0 rounded-4 h-100 dashboard-card">
          <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-2">
              <h6 class="text-muted text-uppercase mb-0">Productos</h6>
              <span class="badge bg-primary-subtle text-primary"><i class="fa-solid fa-box"></i></span>
            </div>
            <h3 class="fw-bold mb-0" id="resumenProductosVendedor">0</h3>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card shadow-sm border-0 rounded-4 h-100 dashboard-card">
          <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-2">
              <h6 class="text-muted text-uppercase mb-0">Stock total</h6>
              <span class="badge bg-success-subtle text-success"><i class="fa-solid fa-warehouse"></i></span>
            </div>
            <h3 class="fw-bold mb-0 text-success" id="resumenStockVendedor">0</h3>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card shadow-sm border-0 rounded-4 h-100 dashboard-card">
          <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-2">
              <h6 class="text-muted text-uppercase mb-0">Pedidos activos</h6>
              <span class="badge bg-warning-subtle text-warning"><i class="fa-solid fa-truck-fast"></i></span>
            </div>
            <h3 class="fw-bold mb-0" id="resumenPedidosVendedor">0</h3>
          </div>
        </div>
      </div>
    </div>

    <div id="vendedorInformes" class="mb-4"></div>

    <div class="row g-4">
      <div class="col-lg-7">
        <div class="card border-0 shadow-sm rounded-4">
          <div class="card-body">
            <h4 class="fw-bold mb-3"><i class="fa-solid fa-boxes-stacked me-2 text-primary"></i>Inventario</h4>
            <div class="table-responsive">
              <table class="table table-sm table-hover align-middle mb-0">
                <thead class="table-light">
                  <tr>
                    <th>Producto</th>
                    <th>Categoría</th>
                    <th>Precio</th>
                    <th>Stock</th>
                  </tr>
                </thead>
                <tbody id="tablaVendedorProductos"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>

      <div class="col-lg-5">
        <div class="card border-0 shadow-sm rounded-4">
          <div class="card-body">
            <h4 class="fw-bold mb-3"><i class="fa-solid fa-truck-fast me-2 text-warning"></i>Pedidos</h4>
            <div class="table-responsive">
              <table class="table table-sm table-hover align-middle mb-0">
                <thead class="table-light">
                  <tr>
                    <th>ID</th>
                    <th>Cliente</th>
                    <th>Total</th>
                    <th>Estado</th>
                  </tr>
                </thead>
                <tbody id="tablaVendedorPedidos"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="script.js"></script>
</body>
</html>
