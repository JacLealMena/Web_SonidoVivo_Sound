<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - Sonido Vivo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border-0 rounded-4">
          <div class="card-body p-4 p-md-5">
            <h3 class="fw-bold mb-4 text-center">Crear Cuenta</h3>
            <form onsubmit="procesarRegistro(event)">
              <div class="mb-3">
                <label class="form-label fw-semibold">Nombre Completo</label>
                <input type="text" class="form-control" required placeholder="Ej. Ana María">
              </div>
              <div class="mb-3">
                <label class="form-label fw-semibold">Correo Electrónico</label>
                <input type="email" class="form-control" required placeholder="correo@ejemplo.com">
              </div>
              <div class="mb-3">
                <label class="form-label fw-semibold">Contraseña</label>
                <input type="password" class="form-control" required placeholder="••••••••">
              </div>
              <button type="submit" class="btn btn-warning w-100 py-2 fw-bold mb-3">Registrarse</button>
            </form>

            <div class="text-center">
              <a href="index.html" class="text-secondary text-decoration-none small">Volver a la tienda</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="script.js"></script>
</body>
</html>
